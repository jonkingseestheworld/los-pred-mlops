[project]
name = "los-pred"
version = "0.1.0"
description = "MLOps workflow practice: hospital length-of-stay prediction on healthcare utilisation data"
readme = "README.md"
authors = [
    { name = "JoKL", email = "johnnykinglau@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "evidently>=0.7.21",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "mlflow>=3.16.0",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "xgboost>=3.4.1",
]

[project.scripts]
los-pred = "los_pred:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
