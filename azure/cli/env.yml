# Azure ML ENVIRONMENT ASSET definition (CLI pass).
#   az ml environment create --file azure/cli/env.yml
#
# Not to be confused with ../environment.yml, which is the conda package list.
# This file points at it: Microsoft base image + that pinned conda spec, i.e. the
# same definition the portal pass created (path relative to THIS file).
$schema: https://azuremlschemas.azureedge.net/latest/environment.schema.json
name: los-pred-scoring-env
image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu20.04
conda_file: ../environment.yml
description: Pinned LightGBM/MLflow scoring runtime for the LOS model
